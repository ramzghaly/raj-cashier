<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
/* Layout: a cashier's ledger — sticky till header, day sheet with revenue & expense ledgers side by side, month and category views as tabs */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEC; --line:#D4DEDA; --fg:#14211E; --muted:#5B6B67;
  --accent:#0E6E55; --accent-soft:#D9EFE7; --cash:#0E6E55; --visa:#2C55C9; --talabat:#D2561B; --exp:#B83A2B; --adv:#8A5A00;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --sunk:#1D2A26; --line:#2A3A35; --fg:#E4ECE9; --muted:#93A5A0;
  --accent:#3FC79C; --accent-soft:#183A30; --cash:#3FC79C; --visa:#7D9CF2; --talabat:#F08A52; --exp:#EF7A6A; --adv:#E0B45A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --sunk:#1D2A26; --line:#2A3A35; --fg:#E4ECE9; --muted:#93A5A0;
  --accent:#3FC79C; --accent-soft:#183A30; --cash:#3FC79C; --visa:#7D9CF2; --talabat:#F08A52; --exp:#EF7A6A; --adv:#E0B45A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.num,td.n,input.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.5px;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.status{font-size:12px;color:var(--muted);min-width:70px}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .grow{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
input[type=date],input[type=month]{padding:6px 8px}
.daylabel{font-family:var(--f-display);font-size:20px;font-weight:700}
.daylabel span{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;align-items:start}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:8px 10px;background:var(--sunk);white-space:nowrap}

td.n,th.n{text-align:end;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}

.ledger input{width:100%;border-color:transparent;background:transparent}
.ledger input:hover{border-color:var(--line)}
.ledger input:focus{border-color:var(--accent);background:var(--surface)}
.ledger input.n{text-align:end;width:7.5em}
.ledger select{border-color:transparent;background:transparent;max-width:11em}
.ledger select:hover{border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.cash{color:var(--cash)}.chip.visa{color:var(--visa)}.chip.talabat{color:var(--talabat)}.chip.adv{color:var(--adv)}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--exp);background:var(--sunk)}
.adds{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.empty{padding:18px 14px;color:var(--muted);font-size:13px}
.auto{color:var(--muted)}
.uncat{color:var(--exp)}
.note{font-size:12px;color:var(--muted)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:80px}
.mini i{display:block;height:100%}
tr.click{cursor:pointer}
tr.today td{background:var(--accent-soft)}
.catrow{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.catrow:hover{background:var(--sunk)}
.catrow .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.catrow .track i{display:block;height:100%;background:var(--accent)}
.catrow .amt{font-family:var(--f-num);text-align:end;white-space:nowrap}
.seg{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--sunk)}
.seg .btn{border:0;background:transparent;color:var(--muted)}
.seg .btn.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 12%,transparent)}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;white-space:nowrap}
table.cmp thead th:first-child,table.cmp tfoot td:first-child{background:var(--sunk)}
table.cmp tr.revrow td{color:var(--accent);font-weight:600}
table.cmp td.click:hover{background:var(--accent-soft)}
.catrow .pct{color:var(--muted);font-size:12px;margin-inline-start:6px}
.ro-banner{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.taglist{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
#bpick{font-weight:700;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.login{max-width:380px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.login input{padding:9px 10px}
.gerr{color:var(--exp);font-size:13px;min-height:1em}
.ck{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:13px}
table.users td,table.users th{white-space:nowrap}
table.users th.c,table.users td.c{text-align:center}
table.users tr.locked td{opacity:.6}
table.users td.acts{display:flex;gap:6px;align-items:center}
.ok{color:var(--cash);font-weight:700}
.btn.danger{border-color:var(--exp);color:var(--exp)}
ul.chg{margin:4px 0 0;padding-inline-start:18px;color:var(--muted);font-size:12.5px}
.closebox .adds{align-items:center;gap:14px}
.closebox .ph h2{font-size:16px}
.sheet{overflow:hidden}
table.xl{border-collapse:collapse;width:max-content;min-width:100%}
table.xl th,table.xl td{border:1px solid var(--line);padding:0;height:32px}
table.xl thead tr.grp th{background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:14px;text-align:start;padding:6px 10px}
table.xl thead th{background:var(--sunk);padding:6px 8px;font-size:12.5px;color:var(--fg)}
table.xl td.gap,table.xl th.gap{width:10px;min-width:10px;background:var(--bg);border-top:0;border-bottom:0}
table.xl td.tot{background:color-mix(in srgb,var(--accent-soft) 55%,transparent);font-family:var(--f-num);font-weight:600;color:var(--accent);padding:0 8px;min-width:6em}
table.xl input{border:0;border-radius:0;background:transparent;width:100%;height:31px;padding:0 8px}
table.xl input.n{width:5.5em;text-align:end;font-family:var(--f-num)}
table.xl td.descc{min-width:11em}
table.xl td.descc input{min-width:11em}
table.xl td.catc{min-width:8.5em;padding:0 4px}
table.xl td.catc select{border:0;background:transparent;width:100%;max-width:11em}
table.xl td.catc select.auto{color:var(--muted)}
table.xl input:focus,table.xl select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
table.xl input:disabled{color:var(--fg);-webkit-text-fill-color:var(--fg)}
table.xl tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
table.xl tbody tr:hover td.gap{background:var(--bg)}
table.xl tfoot td{background:var(--sunk);font-weight:700;font-family:var(--f-num);padding:0 8px}
table.xl tfoot td.gap{background:var(--bg)}
table.xl.tot td{padding:0 10px;white-space:nowrap}
table.xl.tot td.strong{font-weight:700}
.mpick{position:relative}
.mpick summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 28px 6px 10px;font-family:var(--f-num);white-space:nowrap;position:relative}
.mpick summary::-webkit-details-marker{display:none}
.mpick summary::after{content:"▾";position:absolute;inset-inline-end:10px;color:var(--muted)}
.mpick .mlist{position:absolute;z-index:4;inset-inline-start:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:190px;max-height:320px;overflow:auto;box-shadow:0 6px 20px color-mix(in srgb,var(--fg) 14%,transparent)}
.mpick .mbtns{display:flex;gap:6px;margin-bottom:4px}
.mpick .ck{padding:4px 6px;border-radius:6px;font-family:var(--f-num)}
.mpick .ck:hover{background:var(--sunk)}
.btn.install{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.kpis.k12{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:900px){.kpis.k12{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis.k12{grid-template-columns:repeat(2,minmax(0,1fr))}}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){.kpi .v{font-size:17px}.kpi.hero .v{font-size:20px}nav{margin-inline-start:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
/* ربط Cashier بـ Firebase (مشروع raj-co) */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { initializeFirestore, doc, collection, getDoc, getDocs, setDoc, deleteDoc, onSnapshot, query, limit, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const CFG={apiKey:"AIzaSyDQ37XDYKYPpME5vRwt0emiNQj3dspQU7s",authDomain:"raj-co.firebaseapp.com",projectId:"raj-co",storageBucket:"raj-co.firebasestorage.app",messagingSenderId:"363251868503",appId:"1:363251868503:web:1cf69c6aca0b38d5eb5412"};
// يكتشف اسم قاعدة البيانات في المشروع: (default) أو default
async function detectDb(){
  for(const id of ["raj-co","(default)","default"]){
    try{const r=await fetch("https://firestore.googleapis.com/v1/projects/"+CFG.projectId+"/databases/"+id+"/documents/settings?pageSize=1&key="+CFG.apiKey);
      if(r.status!==404)return id;}catch(e){}
  }
  return "raj-co";
}
const toVal=v=>{
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==="string")return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:v.length?{values:v.map(toVal)}:{}};
  const f={};for(const k of Object.keys(v))if(v[k]!==undefined)f[k]=toVal(v[k]);return{mapValue:{fields:f}};
};
try{
  const app=initializeApp(CFG);
  const DBID=await detectDb();
  const fs=initializeFirestore(app,{ignoreUndefinedProperties:true,experimentalForceLongPolling:true},DBID);
  const auth=getAuth(app);
  try{await setPersistence(auth,browserSessionPersistence);}catch(e){}
  const wrapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const wrapQ=s=>({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty,docChanges:()=>s.docChanges().map(c=>({type:c.type,doc:wrapDoc(c.doc),oldIndex:c.oldIndex,newIndex:c.newIndex}))});
  const dref=p=>{const r=doc(fs,p);return{id:r.id,path:p,_r:r,get:async()=>wrapDoc(await getDoc(r)),set:d=>setDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(n,e)=>onSnapshot(r,s=>n(wrapDoc(s)),e)};};
  const qref=(c,cons)=>({orderBy:(f,d)=>qref(c,[...cons,orderBy(f,d||"asc")]),limit:n=>qref(c,[...cons,limit(n)]),
    get:async()=>wrapQ(await getDocs(query(collection(fs,c),...cons))),onSnapshot:(n,e)=>onSnapshot(query(collection(fs,c),...cons),s=>n(wrapQ(s)),e)});
  const fdb={doc:dref,collection:c=>qref(c,[]),batch:()=>{const b=writeBatch(fs);return{set:(r,d)=>{b.set(r._r,d);},commit:()=>b.commit()};}};
  const fauth={get currentUser(){return auth.currentUser;},
    signInWithEmailAndPassword:(e,p)=>signInWithEmailAndPassword(auth,e,p),
    createUserWithEmailAndPassword:(e,p)=>createUserWithEmailAndPassword(auth,e,p),
    signOut:()=>signOut(auth),onAuthStateChanged:cb=>onAuthStateChanged(auth,cb)};
  let sec=null;
  async function createSecondaryUser(email,pw){sec=sec||initializeApp(CFG,"sec");const a2=getAuth(sec);try{await createUserWithEmailAndPassword(a2,email,pw);}finally{try{await signOut(a2);}catch(e){}}}
  async function restCommit(list){
    if(!auth.currentUser)throw new Error("not signed in");
    const tok=await auth.currentUser.getIdToken();
    const base="projects/"+CFG.projectId+"/databases/"+DBID+"/documents";
    const r=await fetch("https://firestore.googleapis.com/v1/"+base+":commit",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},
      body:JSON.stringify({writes:list.map(([p,d])=>({update:{name:base+"/"+p,fields:toVal(d).mapValue.fields}}))})});
    if(!r.ok){let m="";try{const j=await r.json();m=(j.error&&(j.error.status+" "+j.error.message))||"";}catch(e){}throw new Error("HTTP "+r.status+" "+m);}
  }
  const updatePw=pw=>updatePassword(auth.currentUser,pw);
  window.__fbResolve({fdb,fauth,createSecondaryUser,restCommit,updatePw,DBID});
}catch(e){window.__fbResolve({error:e});}

const expSum=r=>EXPK.reduce((s,k)=>s+num(r[k]),0);
const rowFilled=r=>!!r&&(revSum(r)!==0||expSum(r)!==0||String(r.desc||'').trim()!==''||!!r.cat);
function toRows(v){
  if(Array.isArray(v.rows))return v.rows.map(r=>({...blankRow(),...r}));
  const R=(v.rev||[]).map(r=>{if(r&&r.ch){const o={};o[r.ch==='talabat'?'tvisa':r.ch]=r.amt;return o;}return{cash:r.cash??'',visa:r.visa??'',tvisa:r.talabat??''};});
  const E=[...(v.exp||[]).map(x=>({[x.kind==='advance'?'adv':'exp']:x.amt,desc:x.desc||'',cat:x.cat||''})),
           ...(v.ext||[]).map(x=>({ext:x.amt,desc:x.desc||'',cat:x.cat||''}))];
  const n=Math.max(R.length,E.length),out=[];
  for(let i=0;i<n;i++)out.push({...blankRow(),...(R[i]||{}),...(E[i]||{})});

}

/* ---------- totals ---------- */
function dayTot(d){
  const t={cash:0,visa:0,tcash:0,tvisa:0,fin:0,rev:0,exp:0,ext:0,bank:0,adv:0,expAll:0,talabat:0,net:0};
  if(!d) return t;
  for(const r of d.rows||[]){for(const k of [...REV,...EXPK])t[k]+=num(r[k]);}
  t.rev=t.cash+t.visa+t.tcash+t.tvisa+t.fin; t.talabat=t.tcash+t.tvisa;
  t.expAll=t.exp+t.ext+t.bank+t.adv;
  t.net=t.cash+t.tcash+t.fin-t.exp-t.adv;   // النقدية المتوقعة في الدرج
  return t;
}

const timers={}, saving={}, again={}, dirty={}, lastSaved={}, aTimers={}; let setDirty=false;

function touch(date){

  const key=curBranch+'|'+date; const d=days[date]; if(d){d.by=me;d.at=new Date().toISOString();}
  dirty[key]=true; setStatus('لم يُحفظ بعد');
  clearTimeout(timers[key]); timers[key]=setTimeout(()=>save(key),700);
}
async function save(key){
  const date=key.split('|')[1], br=key.split('|')[0];
  if(saving[key]){again[key]=true;return;}
  saving[key]=true; setStatus('جارٍ الحفظ…');
  try{
    const d=daysBy[br][date];
    const rows=d?trimRows(d.rows||[]):[];
    const empty=!d||(!rows.length&&dayStatus(d)==='open'&&!d.reopenedBy);
    const ref=db.doc(BR[br].coll+'/'+date);
    if(empty) await ref.delete(); else{const o=JSON.parse(JSON.stringify({...d,rows}));delete o.rev;delete o.exp;delete o.ext;await ref.set(await pack(o));}
    setStatus('تم الحفظ ✓'); scheduleAudit(key);
  }catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){canWrite=false;setStatus('للعرض فقط');render();} else setStatus('تعذّر الحفظ، حاول مرة أخرى'); }
  saving[key]=false; if(again[key]){again[key]=false;save(key);} else delete dirty[key];
}

function saveSettings(){

}
function scheduleAudit(key){clearTimeout(aTimers[key]);aTimers[key]=setTimeout(()=>flushAudit(key),auditNote[key]?0:15000);}
function flushAudit(key){clearTimeout(aTimers[key]);delete aTimers[key];const[br,date]=key.split('|');const cur=daysBy[br][date];
  const curJ=JSON.stringify(cur||{rows:[]});const base=lastSaved[key]?JSON.parse(lastSaved[key]):null;

  lastSaved[key]=curJ; if(c.length||note)logAudit({br,d:date,a:note||'تعديل اليومية',c});}

function sumDiff(m){let s=0;for(const dt of monthDays(m||curMonth)){if(curBranch==='all'){for(const b of userBranches())s+=daysBy[b][dt]?.diff||0;}else s+=days[dt]?.diff||0;}return s;}
let selMonths=null, mpOpen=false;
function selMs(){const all=allMonths();let m=(selMonths||[curMonth]).filter(x=>all.includes(x));if(!m.length)m=[curMonth];return m.sort();}
function allMonths(){const ms=new Set(Object.keys(days).map(k=>k.slice(0,7)));ms.add(curMonth);ms.add(iso(today).slice(0,7));return [...ms].sort().reverse();}
function monthPicker(){const sel=selMs(), all=allMonths();
  const label=sel.length===1?sel[0]:sel.length===all.length?`كل الشهور (${sel.length})`:`${sel.length} شهور: ${sel[0]} ← ${sel[sel.length-1]}`;
  return `<details class="mpick" id="mpd"${mpOpen?' open':''}><summary>${esc(label)}</summary><div class="mlist">
   <div class="mbtns"><button class="btn" data-act="msall" type="button">الكل</button><button class="btn" data-act="mslast3" type="button">آخر 3 شهور</button></div>
   ${all.map(m=>`<label class="ck"><input type="checkbox" id="ms-${m}" data-msel="${m}"${sel.includes(m)?' checked':''}> ${m}</label>`).join('')}
  </div></details>`;}
function monthTot(m){const T={...dayTot(null),diff:0,days:0};
  for(const dt of monthDays(m)){const t=dayTot(days[dt]);for(const k in t)if(k in T)T[k]+=t[k]||0;if(hasData(t))T.days++;}
  T.diff=sumDiff(m);return T;}
const TH=`<th class="n">صافي الكاش</th><th class="n">الإجمالي</th><th class="n">كاش</th><th class="n">فيزا</th><th class="n">طلبات</th><th></th><th class="n">مصروفات</th><th class="n">سلف</th><th class="n">مصروف خارجي</th><th class="n">من البنك</th><th class="n">تمويل</th><th class="n">عجز / زيادة</th>`;
function renderMonth(){
  const ms=selMs(), multi=ms.length>1; if(!multi)curMonth=ms[0];
  const T=dayTot(null);
  const mts=ms.map(m=>[m,monthTot(m)]); for(const[,t]of mts)for(const k in T)T[k]+=t[k]||0;
  const netCash=T.net, totDiff=mts.reduce((s,[,t])=>s+t.diff,0);
  const bar=(t,max)=>`<td><div class="mini" title="كاش / فيزا / طلبات" style="width:${Math.max(4,Math.round(t.rev/max*120))}px">${t.rev?`<i style="width:${t.cash/t.rev*100}%;background:var(--cash)"></i><i style="width:${t.visa/t.rev*100}%;background:var(--visa)"></i><i style="width:${t.talabat/t.rev*100}%;background:var(--talabat)"></i>`:''}</div></td>`;
  const nums=t=>`<td class="n">${t.cash?fmt(t.cash):''}</td><td class="n">${t.visa?fmt(t.visa):''}</td><td class="n">${t.talabat?fmt(t.talabat):''}</td>`;
  const tail=t=>`<td class="n">${t.exp?fmt(t.exp):''}</td><td class="n">${t.adv?fmt(t.adv):''}</td><td class="n">${t.ext?fmt(t.ext):''}</td><td class="n">${t.bank?fmt(t.bank):''}</td><td class="n">${t.fin?fmt(t.fin):''}</td>`;
  const foot=(first)=>`<tfoot><tr><td>الإجمالي</td><td class="n">${fmt(first)}</td><td class="n">${fmt(T.rev)}</td><td class="n">${fmt(T.cash)}</td><td class="n">${fmt(T.visa)}</td><td class="n">${fmt(T.talabat)}</td><td></td><td class="n">${fmt(T.exp)}</td><td class="n">${fmt(T.adv)}</td><td class="n">${fmt(T.ext)}</td><td class="n">${fmt(T.bank)}</td><td class="n">${fmt(T.fin)}</td><td class="n">${fmt(totDiff)}</td><td></td></tr></tfoot>`;
  let body;
  if(multi){const max=Math.max(1,...mts.map(([,t])=>t.rev));
    body=`<thead><tr><th>الشهر</th>${TH}<th class="n">أيام بها حركة</th></tr></thead><tbody>${mts.map(([m,t])=>`<tr class="click" data-onemonth="${m}" tabindex="0"><td class="num">${m}</td>
      <td class="n" style="font-weight:600">${fmt(t.net)}</td><td class="n">${fmt(t.rev)}</td>${nums(t)}${bar(t,max)}${tail(t)}<td class="n">${t.diff?`<span style="color:var(--exp)">${fmt(t.diff)}</span>`:'0'}</td><td class="n">${t.days}</td></tr>`).join('')}</tbody>${foot(netCash)}`;}
  else{const rows=monthDays(curMonth).map(dt=>[dt,dayTot(days[dt])]);const max=Math.max(1,...rows.map(r=>r[1].rev));
    body=`<thead><tr><th>اليوم</th>${TH}<th>الحالة</th></tr></thead><tbody>${rows.map(([dt,t])=>{const d=new Date(dt+'T00:00:00');const has=hasData(t);return `<tr class="click${dt===iso(today)?' today':''}" data-go="${dt}" tabindex="0">
      <td>${d.getDate()} <span class="note">${DAYNAMES[d.getDay()]}</span></td>
      <td class="n" style="font-weight:600">${has?fmt(t.net):'—'}</td><td class="n">${has?fmt(t.rev):'—'}</td>${nums(t)}${bar(t,max)}${tail(t)}${statCells(dt,has)}</tr>`}).join('')}</tbody>${foot(T.net)}`;}
  return `<div class="bar"><h2>${multi?'ملخص الشهور':'ملخص الشهر'} · ${esc(brLabel())}</h2>${monthPicker()}<span class="grow"></span>${dl?'<button class="btn" data-act="csv">تصدير Excel</button>':''}</div>
  <div class="kpis">
    ${kpi('إجمالي الإيراد',T.rev)}${kpi('كاش',T.cash,'cash')}${kpi('فيزا',T.visa,'visa')}${kpi('طلبات',T.talabat,'talabat')}
    ${kpi('مصروفات',T.exp,'exp')}${kpi('سلف',T.adv,'adv')}${kpi('مصروف خارجي',T.ext)}${kpi('مصروف من البنك',T.bank)}${kpi('تمويل',T.fin)}
    ${kpi('صافي الكاش في الدرج',netCash,'',true)}
  </div>
  <section class="panel"><div class="scroll"><table>${body}</table></div></section>
  <p class="note">صافي الكاش في الدرج = كاش + طلبات كاش + تمويل − مصروفات − سلف. ${multi?'اضغط على أي شهر لعرض أيامه.':'اضغط على أي يوم لفتح يوميته.'}</p>`;
}

function monthLines(m){
  const out=[];
  for(const dt of monthDays(m||curMonth)){const d=days[dt];if(!d)continue;
    (d.rows||[]).forEach((r,i)=>{for(const k of EXPK){const a=num(r[k]);if(!a)continue;
      out.push({dt,i,desc:r.desc,amt:a,kind:k,cat:k==='adv'&&!num(r.exp)&&!num(r.ext)&&!num(r.bank)?ADV_CAT:(k==='adv'?ADV_CAT:(r.cat||autoCat(r.desc)||''))});}});}
  return out;
}
function dataMonths(){return [...new Set(Object.keys(days).map(k=>k.slice(0,7)))].sort().slice(-12);}
function renderCmp(){
  const ms=dataMonths();
  const data=ms.map(m=>{const by={};let tot=0;for(const l of monthLines(m)){const c=l.cat||'غير مصنف';by[c]=(by[c]||0)+l.amt;tot+=l.amt;}
    let rev=0;for(const dt of monthDays(m))rev+=dayTot(days[dt]).rev;return{m,by,tot,rev};});
  const cats=[...new Set([...settings.cats,...data.flatMap(x=>Object.keys(x.by))])].filter(c=>data.some(x=>x.by[c]));
  cats.sort((a,b)=>data.reduce((s,x)=>s+(x.by[b]||0),0)-data.reduce((s,x)=>s+(x.by[a]||0),0));
  const n=ms.length; const last=data[n-1], prev=data[n-2];
  const chg=(a,b)=>{if(!b)return '<td class="n note">—</td>';const p=Math.round((a-b)/b*100);return `<td class="n" style="color:var(${p>0?'--exp':'--cash'})">${p>0?'+':''}${p}%</td>`;};
  const cell=(v,m,c)=>`<td class="n${c?' click':''}"${c&&v?` data-cm="${m}" data-cat="${esc(c)}" style="cursor:pointer"`:''}>${v?fmt(v):'<span class="note">—</span>'}</td>`;
  const sumRow=f=>data.reduce((s,x)=>s+f(x),0);
  return `<section class="panel"><div class="ph"><h2>المصروفات حسب التصنيف · ${n} ${n>2&&n<11?'شهور':'شهر'}</h2><span class="note">اضغط على أي رقم لعرض بنوده</span></div>
  ${n?`<div class="scroll"><table class="cmp"><thead><tr><th>التصنيف</th>${ms.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">الإجمالي</th><th class="n">المتوسط</th>${n>1?'<th class="n">التغير عن الشهر السابق</th>':''}</tr></thead>
  <tbody>
   <tr class="revrow"><td>إجمالي الإيراد</td>${data.map(x=>`<td class="n">${fmt(x.rev)}</td>`).join('')}<td class="n">${fmt(sumRow(x=>x.rev))}</td><td class="n">${fmt(sumRow(x=>x.rev)/n)}</td>${n>1?chg(last.rev,prev.rev):''}</tr>
   ${cats.map(c=>{const t=sumRow(x=>x.by[c]||0);return `<tr><td class="${c==='غير مصنف'?'uncat':''}">${esc(c)}</td>${data.map(x=>cell(x.by[c]||0,x.m,c)).join('')}<td class="n" style="font-weight:600">${fmt(t)}</td><td class="n">${fmt(t/n)}</td>${n>1?chg(last.by[c]||0,prev.by[c]||0):''}</tr>`}).join('')}
  </tbody>
  <tfoot>
   <tr><td>إجمالي المصروفات</td>${data.map(x=>`<td class="n">${fmt(x.tot)}</td>`).join('')}<td class="n">${fmt(sumRow(x=>x.tot))}</td><td class="n">${fmt(sumRow(x=>x.tot)/n)}</td>${n>1?chg(last.tot,prev.tot):''}</tr>
   <tr><td>نسبة المصروفات من الإيراد</td>${data.map(x=>`<td class="n">${x.rev?Math.round(x.tot/x.rev*100):0}%</td>`).join('')}<td class="n">${sumRow(x=>x.rev)?Math.round(sumRow(x=>x.tot)/sumRow(x=>x.rev)*100):0}%</td><td></td>${n>1?'<td></td>':''}</tr>
   <tr><td>صافي (الإيراد − المصروفات)</td>${data.map(x=>`<td class="n">${fmt(x.rev-x.tot)}</td>`).join('')}<td class="n">${fmt(sumRow(x=>x.rev-x.tot))}</td><td class="n">${fmt(sumRow(x=>x.rev-x.tot)/n)}</td>${n>1?chg(last.rev-last.tot,prev.rev-prev.tot):''}</tr>
  </tfoot></table></div>`:'<div class="empty">لا توجد بيانات بعد.</div>'}
  </section>
  <p class="note">المصروفات هنا تشمل المصروفات والمصروف الخارجي والمصروف من البنك والسلف. يُعرض آخر 12 شهراً فيها بيانات.</p>`;
}
function renderCats(){
  const modeBar=`<div class="bar"><div class="seg" role="tablist"><button class="btn${catMode==='one'?' on':''}" data-mode="one" aria-pressed="${catMode==='one'}">شهر واحد</button><button class="btn${catMode==='cmp'?' on':''}" data-mode="cmp" aria-pressed="${catMode==='cmp'}">مقارنة الشهور</button></div>${catMode==='cmp'&&dl?'<span class="grow"></span><button class="btn" data-act="cmpcsv">تصدير Excel</button>':''}</div>`;
  if(catMode==='cmp') return modeBar+`<h2>مقارنة المصروفات بين الشهور · ${esc(brLabel())}</h2>`+renderCmp();
  return modeBar+renderCatsOne();
}
function renderCatsOne(){
  const L=monthLines(); const by={}; let total=0;
  for(const l of L){const c=l.cat||'غير مصنف';(by[c]=by[c]||{sum:0,n:0}).sum+=l.amt;by[c].n++;total+=l.amt;}
  const arr=Object.entries(by).sort((a,b)=>b[1].sum-a[1].sum); const max=Math.max(1,...arr.map(a=>a[1].sum));
  const unc=L.filter(l=>!l.cat);
  const uncDescs={}; for(const l of unc){const k=l.desc||'(بدون وصف)';(uncDescs[k]=uncDescs[k]||{sum:0,n:0}).sum+=l.amt;uncDescs[k].n++;}
  const fl=focusCat?L.filter(l=>(l.cat||'غير مصنف')===focusCat):null;
  return `<div class="bar"><h2>تحليل المصروفات · ${esc(brLabel())}</h2><select id="mpick" aria-label="الشهر">${monthOptions()}</select><span class="grow"></span><span class="num">${fmt(total)}</span></div>
  <section class="panel"><div class="ph"><h2>التصنيفات</h2><span class="note">تشمل المصروفات والمصروف الخارجي ومن البنك والسلف · اضغط على تصنيف لعرض بنوده</span></div>
  ${arr.length?arr.map(([c,v])=>`<div class="catrow" data-cat="${esc(c)}" tabindex="0"><span class="${c==='غير مصنف'?'uncat':''}" style="font-weight:600">${esc(c)} <span class="note">(${v.n})</span></span><div class="track"><i style="width:${v.sum/max*100}%;${c==='غير مصنف'?'background:var(--exp)':c===ADV_CAT?'background:var(--adv)':''}"></i></div><span class="amt">${fmt(v.sum)}<span class="pct">${total?Math.round(v.sum/total*100):0}%</span></span></div>`).join(''):'<div class="empty">لا توجد مصروفات في هذا الشهر.</div>'}
  </section>
  ${fl?`<section class="panel"><div class="ph"><h2>بنود: ${esc(focusCat)}</h2><button class="btn" data-act="clearcat">إغلاق</button></div><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الوصف</th><th class="n">المبلغ</th><th></th></tr></thead><tbody>
    ${fl.map(l=>`<tr class="click" data-go="${l.dt}"><td class="num">${l.dt.slice(5)}</td><td>${esc(l.desc)||'—'}</td><td class="n">${fmt(l.amt)}</td><td>${l.kind==='ext'?'<span class="chip visa">مصروف خارجي</span>':l.kind==='bank'?'<span class="chip visa">من البنك</span>':l.kind==='adv'?'<span class="chip adv">سلفة</span>':''}</td></tr>`).join('')}
  </tbody></table></div></section>`:''}
  ${Object.keys(uncDescs).length?`<section class="panel"><div class="ph"><h2>أوصاف غير مصنفة</h2><span class="note">اختر التصنيف مرة واحدة ويتم حفظه لكل البنود بنفس الوصف</span></div><div class="scroll"><table><thead><tr><th>الوصف</th><th class="n">عدد</th><th class="n">المبلغ</th><th>التصنيف</th></tr></thead><tbody>
    ${Object.entries(uncDescs).sort((a,b)=>b[1].sum-a[1].sum).map(([k,v],i)=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${fmt(v.sum)}</td><td>${canSet()&&k!=='(بدون وصف)'?`<select id="u-${i}" data-map="${esc(k)}">${catOptions('',true,'اختر…')}</select>`:''}</td></tr>`).join('')}
  </tbody></table></div></section>`:''}`;
}

function renderSettings(){
  const entries=Object.entries(settings.map).sort((a,b)=>a[1].localeCompare(b[1],'ar')||a[0].localeCompare(b[0],'ar'));
  return `<div class="bar"><h2>التصنيفات وربط الأوصاف</h2></div>
  <section class="panel"><div class="ph"><h2>قائمة التصنيفات</h2><span class="note">${settings.cats.length} تصنيف</span></div>
    <div class="taglist">${settings.cats.map((c,i)=>`<span class="tag">${esc(c)}${canSet()?`<button class="x" data-delcat="${i}" aria-label="حذف ${esc(c)}">×</button>`:''}</span>`).join('')}</div>
    ${canSet()?`<div class="adds"><input id="newcat" placeholder="تصنيف جديد"><button class="btn pri" data-act="addcat">إضافة تصنيف</button></div>`:''}
  </section>
  <section class="panel"><div class="ph"><h2>ربط الوصف بالتصنيف</h2><span class="note">يُستخدم لتصنيف المصروفات تلقائياً. "ق/العثيم" تُطابق "فاتورة العثيم".</span></div>
    ${canSet()?`<div class="adds"><input id="newdesc" placeholder="الوصف، مثال: فاتورة الخباز"><select id="newdesccat">${catOptions('',false)}</select><button class="btn pri" data-act="addmap">إضافة ربط</button></div>`:''}
    <div class="scroll"><table><thead><tr><th>الوصف</th><th>التصنيف</th><th></th></tr></thead><tbody>
    ${entries.map(([k,v],i)=>`<tr><td>${esc(k)}</td><td>${canSet()?`<select id="m-${i}" data-remap="${esc(k)}">${catOptions(v,false)}</select>`:esc(v)}</td><td>${canSet()?`<button class="x" data-delmap="${esc(k)}" aria-label="حذف">×</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener('toggle',e=>{if(e.target.id==='mpd')mpOpen=e.target.open;},true);
document.addEventListener('click',e=>{if(mpOpen&&!e.target.closest('#mpd')){mpOpen=false;const d=$('#mpd');if(d)d.open=false;}});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;focusCat=null;try{localStorage.setItem('cashier.view',view)}catch(_){}render();window.scrollTo(0,0);});
function shift(n){flushAllAudit();const d=new Date(curDate+'T00:00:00');d.setDate(d.getDate()+n);curDate=iso(d);curMonth=curDate.slice(0,7);render();}
app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-add],[data-del],[data-go],[data-cat],[data-delcat],[data-delmap],[data-mode],[data-onemonth]'); if(!t)return;
  if(t.dataset.onemonth){selMonths=[t.dataset.onemonth];curMonth=t.dataset.onemonth;mpOpen=false;return render();}
  if(t.dataset.mode){catMode=t.dataset.mode;focusCat=null;return render();}
  if(t.dataset.cm){curMonth=t.dataset.cm;focusCat=t.dataset.cat;catMode='one';render();const p=document.querySelectorAll('.panel')[1];p&&p.scrollIntoView({block:'start'});return;}
  if(t.dataset.act==='cmpcsv')return exportCmp();
  const a=t.dataset.act;
  if(a==='msall'){selMonths=allMonths();mpOpen=true;return render();}
  if(a==='mslast3'){selMonths=allMonths().slice(0,3);mpOpen=true;return render();}
  if(a==='prev')return shift(-1); if(a==='next')return shift(1);
  if(a==='today'){curDate=iso(today);curMonth=curDate.slice(0,7);return render();}
  if(a==='clearcat'){focusCat=null;return render();}
  if(a==='csv')return exportCsv();
  if(a==='addcat'){const v=$('#newcat').value.trim();if(v&&!settings.cats.includes(v)){settings.cats.push(v);saveSettings();}return render();}
  if(a==='addmap'){const k=$('#newdesc').value.trim(),c=$('#newdesccat').value;if(k&&c){settings.map[k]=c;saveSettings();}return render();}
  if(t.dataset.go){if(t.dataset.gb&&userBranches().includes(t.dataset.gb)){curBranch=t.dataset.gb;applyBranch();}curDate=t.dataset.go;curMonth=curDate.slice(0,7);view='day';return render();}
  if(t.dataset.cat){focusCat=t.dataset.cat;return render();}
  if(t.dataset.delcat!=null){settings.cats.splice(+t.dataset.delcat,1);saveSettings();return render();}
  if(t.dataset.delmap!=null){delete settings.map[t.dataset.delmap];saveSettings();return render();}
  if(a==='addrows'){if(!canEditDay())return;const d=ensureDay(curDate);const n=Math.max(GRID_ROWS,d.rows.length+3);while(d.rows.length<n+2)d.rows.push(blankRow());return render();}
  if(a==='totcsv')return exportTotal();
});
app.addEventListener('keydown',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.g!=null&&(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp')&&el.tagName==='INPUT'){
    const i=+el.dataset.g+(e.key==='ArrowUp'?-1:1);const nx=document.getElementById(`g-${el.dataset.f}-${i}`);
    if(nx){e.preventDefault();nx.focus();try{nx.select();}catch(_){}}return;}
  if(e.key==='Enter'){const r=el.closest('[data-go],[data-cat]');if(r&&!el.matches('input,select'))r.click();}});
function gridRow(i){const d=ensureDay(curDate);while(d.rows.length<=i)d.rows.push(blankRow());return d.rows[i];}
app.addEventListener('input',e=>{
  const el=e.target; if(el.dataset.g==null||el.tagName!=='INPUT'||!canEditDay())return;
  const i=+el.dataset.g, f=el.dataset.f; const row=gridRow(i);
  const isNum=REV.includes(f)||EXPK.includes(f);
  row[f]=isNum?(el.value.trim()===''?'':num(el.value)):el.value;
  if(isNum){const rt=document.getElementById('g-rt-'+i),et=document.getElementById('g-et-'+i);
    if(rt)rt.textContent=revSum(row)?fmt(revSum(row)):'';if(et)et.textContent=expSum(row)?fmt(expSum(row)):'';}
  touch(curDate); liveTotals();
  if(f==='desc'){const sel=document.getElementById('g-cat-'+i);if(sel){const ac=autoCat(el.value);sel.options[0].textContent=ac?('تلقائي: '+ac):'';if(!row.cat)sel.className=ac?'auto':'';}}
});
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dpick'&&el.value){flushAllAudit();curDate=el.value;curMonth=curDate.slice(0,7);return render();}
  if(el.id==='mpick'){curMonth=el.value;selMonths=null;focusCat=null;return render();}
  if(el.dataset.msel){const set=new Set(selMs());el.checked?set.add(el.dataset.msel):set.delete(el.dataset.msel);if(!set.size){el.checked=true;return;}selMonths=[...set];mpOpen=true;return render();}
  if(el.dataset.map){if(el.value){settings.map[el.dataset.map]=el.value;saveSettings();render();}return;}

    (old?`<span style="color:var(--exp)">فرع ${esc(BR[st.br].name)} فيه ${old} يوم مسجّل في الشهر ده، وهيتمسحوا ويتحط مكانهم بيانات الملف.</span>`:`فرع ${esc(BR[st.br].name)} مافيهوش بيانات في الشهر ده.`);}
function renderBackup(){
  return `<div class="bar"><h2>النسخ الاحتياطي والتشفير</h2></div>`+encStatus()+`
  <section class="panel"><div class="ph"><h2>تحميل نسخة احتياطية</h2></div>
   <div class="adds" style="border:0"><p class="note" style="margin:0;flex-basis:100%">النسخة فيها كل اليوميات لكل الفروع والتصنيفات والمستخدمين وسجل التعديلات، وهي مشفّرة زي ما هي في السيستم. ماتتفتحش غير بكلمة سر مستخدم من السيستم.</p>
   ${dl?'<button class="btn pri" data-act="backup">تحميل نسخة احتياطية الآن</button>':'<span class="note">التحميل غير متاح في هذا العرض.</span>'}</div></section>
  <section class="panel"><div class="ph"><h2>نسخة يومية</h2></div><div class="adds" style="border:0"><p class="note" style="margin:0">حمّل نسخة من الزرار اللي فوق في آخر كل يوم واحفظها على Google Drive. ممكن كمان تفعّل Scheduled backups لقاعدة البيانات من Firebase Console (محتاجة خطة Blaze).</p></div></section>
  ${U().role==='owner'&&canWrite?`<section class="panel"><div class="ph"><h2>استيراد يومية شهر من Excel</h2><span class="note">للمالك فقط · ملف فيه شيت لكل يوم (1، 2، 3 …) بنفس شكل اليومية</span></div>
   <div class="adds" style="border:0;flex-direction:column;align-items:stretch">
   <label class="ck">الفرع <select id="im-br">${Object.entries(BR).map(([b,x])=>`<option value="${b}"${b===(imState&&imState.br||(curBranch==='all'?'50':curBranch))?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
   <input type="file" id="im-file" accept=".xlsx,.xlsm,.xls">
   ${imState?`<div class="ro-banner">${imState.msg}</div>${imState.ready?`<div class="bar"><button class="btn danger" data-act="doimport">تأكيد: استبدال شهر ${esc(imState.month)} في فرع ${esc(BR[imState.br].name)}</button><button class="btn" data-act="cancelimport">إلغاء</button></div>`:''}`:''}
   </div></section>`:''}
  ${U().role==='owner'?`<section class="panel"><div class="ph"><h2>استرجاع من نسخة احتياطية</h2><span class="note">للمالك فقط</span></div>
   <div class="adds" style="border:0;flex-direction:column;align-items:stretch">
   <input type="file" id="rs-file" accept=".json,.gz,application/json,application/gzip">
   ${restoreState?`<div class="ro-banner">${esc(restoreState.msg)}</div>${restoreState.ready?`<div class="bar"><button class="btn danger" data-act="dorestore">تأكيد الاسترجاع (هيستبدل البيانات الحالية)</button><button class="btn" data-act="cancelrestore">إلغاء</button></div>`:''}`:''}
   </div></section>`:''}`;

/* ---------- استيراد يومية من Excel ---------- */
let imState=null;
function parseCashierXlsx(buf){
  if(!window.XLSX)throw new Error('مكتبة قراءة Excel ماتحمّلتش. اتأكد من الإنترنت وجرب تاني.');
  const wb=XLSX.read(buf,{type:'array'});
  const out={};let month=null;
  const val=(ws,a)=>{const c=ws[a];return c?c.v:undefined;};
  const dateOf=(ws,name)=>{const c=ws['M1'];
    if(c&&c.t==='n'){const d=XLSX.SSF.parse_date_code(c.v);if(d&&d.y)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}
    if(c&&c.t==='d'){const d=c.v;return iso(d);}
    if(c&&c.t==='s'){const m=String(c.v).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
    return null;};
  const cols={B:'cash',C:'visa',D:'tcash',E:'tvisa',F:'fin',I:'exp',J:'ext',K:'adv'};
  for(const name of wb.SheetNames){const ws=wb.Sheets[name];const dt=dateOf(ws,name);if(!dt)continue;
    month=month||dt.slice(0,7);
    const rows=[];
    for(let r=5;r<=30;r++){const row=blankRow();
      for(const[c,k]of Object.entries(cols)){const v=val(ws,c+r);if(typeof v==='number'&&v)row[k]=Math.round(v*100)/100;}
      const d=val(ws,'M'+r);if(d!=null&&String(d).trim())row.desc=String(d).trim();
      const l=val(ws,'L'+r);if(l!=null&&settings.cats.includes(String(l).trim()))row.cat=String(l).trim();
      rows.push(row);}
    out[dt]=trimRows(rows);}
  return {days:out,month};
}
async function doImport(){
  const st=imState;if(!st||!st.ready||U().role!=='owner')return;
  const br=st.br, coll=BR[br].coll, store=daysBy[br];
  imState={...st,ready:false,msg:'جارٍ الاستيراد…'};render();
  const dates=monthDays(st.month);let n=0;
  try{
    for(const dt of dates){const rows=st.days[dt]||[];const key=br+'|'+dt;
      clearTimeout(timers[key]);delete dirty[key];
      const ref=db.doc(coll+'/'+dt);
      if(!rows.length){if(store[dt]||raw.days[br][dt])await withTimeout(ref.delete(),30000);delete store[dt];}
      else{const o={date:dt,rows,by:me,at:new Date().toISOString(),imported:true};
        await withTimeout(ref.set(await pack(o)),30000);store[dt]={...o};lastSaved[key]=JSON.stringify(store[dt]);}
      n++;imState={...st,ready:false,msg:`جارٍ الاستيراد… ${n}/${dates.length}`};const b=document.querySelector('.ro-banner');if(b)b.textContent=imState.msg;}
    logAudit({br,a:`استيراد يومية شهر ${st.month} من Excel (${st.file})`});
    applyBranch();imState=null;
    if(userBranches().includes(br)){curBranch=br;try{localStorage.setItem('cashier.branch',br);}catch(_){}applyBranch();}
    curMonth=st.month;selMonths=null;view='total';render();setStatus('تم الاستيراد ✓');
  }catch(e){imState={...st,ready:false,msg:'تعذّر الاستيراد: '+esc(e.code==='timeout'?'قاعدة البيانات مش بترد':(e.message||''))+`. اتعمل ${n} يوم من ${dates.length}، جرّب تاني.`};render();}
}
async function doBackup(){setStatus('جارٍ تجهيز النسخة…');
  try{const b=await collectBackup();const name=`Cashier-backup-${iso(new Date())}.json`;
    await dl.save({filename:name,data:new Blob([JSON.stringify(b)],{type:'application/json'})});logAudit({a:'تحميل نسخة احتياطية'});setStatus('تم ✓');}
  catch(e){setStatus(e&&e.code==='unavailable'?'التحميل غير متاح':'لم يتم التحميل');}}
app.addEventListener('change',async e=>{
  if(e.target.id==='af-u'){auditFilter.u=e.target.value;return render();}
  if(e.target.id==='af-d'){auditFilter.d=e.target.value;return render();}
  if(e.target.id==='im-br'){if(imState)imState={...imState,br:e.target.value,msg:imState.msg};else imState=null;if(imState&&imState.ready){imState.msg=imMsg(imState);}render();return;}
  if(e.target.id==='im-file'){const f=e.target.files[0];if(!f)return;const br=$('#im-br').value;
    try{const r=parseCashierXlsx(new Uint8Array(await f.arrayBuffer()));
      if(!r.month)throw new Error('مالقيتش تاريخ في الخلية M1 في أي شيت.');
      imState={ready:true,br,month:r.month,days:r.days,file:f.name};imState.msg=imMsg(imState);}
    catch(err){imState={ready:false,br,msg:esc(err.message||'الملف ده مش يومية Cashier.')};}
    render();return;}
  if(e.target.id!=='rs-file')return;const f=e.target.files[0];if(!f)return;
  try{let buf=new Uint8Array(await f.arrayBuffer());if(buf[0]===0x1f&&buf[1]===0x8b){buf=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());}const j=JSON.parse(TD.decode(buf));if(j.app!=='Cashier'||!j.docs)throw 0;
    const n=Object.keys(j.docs).length;const u=j.docs['settings/users'];
    const canOpen=!u||!u.enc||(u.users&&u.users[me]&&u.users[me].wk&&await (async()=>{const cur=users[me];return !!cur;})());
    restoreState={ready:true,data:j,msg:`نسخة بتاريخ ${fmtTime(j.at)} فيها ${n} سجل. الاسترجاع هيستبدل كل البيانات الحالية بالبيانات اللي في النسخة، وهتحتاج تدخل تاني بكلمة سر من وقت النسخة.`};}
  catch(_){restoreState={ready:false,msg:'الملف ده مش نسخة احتياطية من Cashier.'};}
  render();
});
async function doRestore(){const j=restoreState&&restoreState.data;if(!j)return;restoreState={ready:false,msg:'جارٍ الاسترجاع…'};render();
  try{logAudit({a:'استرجاع نسخة احتياطية بتاريخ '+fmtTime(j.at)});await auditQ;
    const keep=new Set(Object.keys(j.docs));
    for(const b in BR)for(const id of Object.keys(raw.days[b]))if(!keep.has(BR[b].coll+'/'+id))await db.doc(BR[b].coll+'/'+id).delete();
    for(const[p,d]of Object.entries(j.docs)){if(p.startsWith('audit/'))continue;await db.doc(p).set(d);}
    restoreState=null;kick('تم الاسترجاع. سجّل الدخول من جديد.');}
  catch(e){restoreState={ready:false,msg:'تعذّر الاسترجاع: '+(e&&e.message||'')};render();}}
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='doimport')doImport(); if(a==='cancelimport'){imState=null;render();}
  if(a==='backup')doBackup(); if(a==='encnow'&&DK&&U()?.role==='owner'){migrateEncrypt().then(()=>{logAudit({a:'تشفير السجلات المتبقية'});render();});} if(a==='dorestore')doRestore(); if(a==='cancelrestore'){restoreState=null;render();}
  if(a==='closeday'||a==='reviewday'||a==='reopenday')dayAction(a);});

/* ---------- day closing / review ---------- */
async function dayAction(a){
  const d=ensureDay(curDate); const key=curBranch+'|'+curDate; const t=dayTot(d);
  if(a==='closeday'){if(!canEditDay())return;
    const cnt=$('#cc-cash'); const v=cnt&&cnt.value.trim(); const er=$('#cc-err');
    if(v===''){er.textContent='اكتب النقدية الفعلية الموجودة في الدرج.';return;}
    const missing=(d.rows||[]).filter(x=>expSum(x)&&!String(x.desc||'').trim()).length;
    if(missing){er.textContent=`فيه ${missing} مصروف من غير وصف. اكتب الوصف قبل الإقفال.`;return;}
    d.rows=trimRows(d.rows||[]);
    d.counted=num(v);d.diff=d.counted-t.net;d.status='closed';d.closedBy=me;d.closedAt=new Date().toISOString();
    auditNote[key]=`إقفال اليومية · النقدية الفعلية ${fmt(d.counted)} · ${d.diff===0?'مطابق':(d.diff<0?'عجز ':'زيادة ')+fmt(Math.abs(d.diff))}`;}
  if(a==='reviewday'){if(!has('review')||dayStatus(d)!=='closed'||d.closedBy===me)return;d.status='reviewed';d.reviewedBy=me;d.reviewedAt=new Date().toISOString();auditNote[key]='مراجعة واعتماد اليومية';}
  if(a==='reopenday'){if(!has('reopen')||dayStatus(d)==='open')return;d.status='open';d.reopenedBy=me;d.reopenedAt=new Date().toISOString();delete d.reviewedBy;delete d.reviewedAt;auditNote[key]='فتح يومية مقفولة';}
  forceTouch(curDate);render();}
const pendingAudit={}, auditNote={};
function forceTouch(date){const key=curBranch+'|'+date;const d=days[date];if(d){d.by=me;d.at=new Date().toISOString();}
  dirty[key]=true;clearTimeout(timers[key]);timers[key]=setTimeout(()=>save(key),50);}

/* ---------- boot (Firebase) ---------- */
let unsubs=[];
function stopData(){for(const u of unsubs){try{u();}catch(e){}}unsubs=[];for(const b in BR)raw.days[b]={};raw.set=null;for(const k in rawAudit)delete rawAudit[k];}
const refresh=()=>{if(ready&&!isTyping())render();};
function startData(){stopData();
  unsubs.push(db.doc('settings/main').onSnapshot(async s=>{raw.set=s.exists?s.data():null;if(me)await ingestSettings();refresh();},e=>setStatus('تعذّر قراءة التصنيفات')));
  if(has('audit'))unsubs.push(db.collection('audit').orderBy('day','desc').limit(400).onSnapshot(async s=>{for(const ch of s.docChanges()){const id=ch.doc.id;if(ch.type==='removed'){delete rawAudit[id];delete auditRows[id];}else{rawAudit[id]=ch.doc.data();if(me)await ingestAudit(id);}}if(view==='audit')refresh();},()=>{}));
  for(const b of userBranches()){
    unsubs.push(db.collection(BR[b].coll).onSnapshot(async s=>{
      for(const ch of s.docChanges()){const id=ch.doc.id;
        if(ch.type==='removed')delete raw.days[b][id];else raw.days[b][id]=ch.doc.data();
        if(me)await ingestDay(b,id);}
      applyBranch(); refresh();
    },e=>setStatus('انقطع الاتصال، أعد تحميل الصفحة')));
  }
}
render();
(async()=>{
  FBX=await window.__fbReady;
  if(FBX.error){ready=true;app.hidden=false;app.innerHTML='<div class="empty">تعذّر تحميل Firebase: '+esc(FBX.error.message||'')+'. تأكد من الاتصال بالإنترنت.</div>';return;}
  fdb=FBX.fdb;fauth=FBX.fauth;db=fdb;
  dl={save:async({filename,data})=>{const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return{status:'saved'};}};
  await new Promise(r=>{const un=fauth.onAuthStateChanged(()=>{un();r();});});
  let first=true;
  db.doc('settings/users').onSnapshot(async s=>{if(!usersSaving){const v=s.exists?JSON.parse(JSON.stringify(s.data())):{};users=v.users||{};delete v.users;usersDoc=v;}
    if(first){first=false;if(await restoreSession()){startData();await decryptAll();pickBranch();}ready=true;render();return;}
    checkMe();if(me&&!userBranches().includes(curBranch)&&curBranch!=='all')pickBranch();refresh();
  },e=>{ready=true;app.hidden=false;app.innerHTML='<div class="empty">تعذّر الاتصال بـ Firebase: '+esc(e.code||e.message)+'. تأكد إنك عملت Firestore Database ولصقت قواعد الحماية ودوست Publish.</div>';});
})();
/* ---------- install as app ---------- */
(function(){
  const btn=$('#installBtn'), hint=$('#iosHint');
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone)btn.hidden=false;});
  window.addEventListener('appinstalled',()=>{btn.hidden=true;deferred=null;});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&!standalone){btn.hidden=false;}
  btn.addEventListener('click',async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;btn.hidden=true;return;}
    if(ios)hint.hidden=!hint.hidden;
  });
  $('#iosClose').addEventListener('click',()=>{hint.hidden=true;});
})();
